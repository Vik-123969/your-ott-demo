<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your OTT — Reset password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#241b43,#090b12 55%);color:#f5f3ff;font:16px system-ui,sans-serif;padding:20px}
.card{width:min(100%,520px);background:#151b2a;border:1px solid #30394e;border-radius:24px;padding:32px;box-shadow:0 20px 60px #0006}
h1{margin:0 0 8px;font-size:28px}p{color:#aab4ca;line-height:1.5}
label{display:block;margin:20px 0 8px;font-weight:600}.field{position:relative}input{width:100%;padding:16px 58px 16px 16px;border-radius:12px;border:1px solid #36415a;background:#0c111d;color:white;font-size:16px}
.eye{position:absolute;right:8px;top:7px;width:auto;margin:0;padding:9px 12px;background:#252d40;color:#ddd;border-radius:8px;font-size:13px}
button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:12px;background:#bba8ff;color:#21183d;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6}
#message{margin-top:16px;overflow-wrap:anywhere}.error{color:#ff9aa5}.ok{color:#65e4ba}
</style></head>
<body><main class="card">
<h1>Set a new password</h1><p>Your OTT account password reset</p>
<div id="form" hidden>
<label for="password">New password (at least 8 characters)</label><div class="field"><input id="password" type="password" minlength="8" autocomplete="new-password"><button class="eye" type="button" data-target="password">Show</button></div>
<label for="confirm">Confirm new password</label><div class="field"><input id="confirm" type="password" minlength="8" autocomplete="new-password"><button class="eye" type="button" data-target="confirm">Show</button></div>
<button id="save" type="button">Update password</button>
</div>
<p id="message">Checking your reset link…</p>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://sbyzeeipaieyrlicigxo.supabase.co','sb_publishable_NFLGfa4faqKZUhErItWJXw_Vku8Pa0v',{auth:{flowType:'implicit',detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
const form=document.getElementById('form'),message=document.getElementById('message');
function show(text,kind=''){message.textContent=text;message.className=kind}
async function init(){
 const hash=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash);
 const query=new URLSearchParams(location.search);
 const errorText=hash.get('error_description')||query.get('error_description');
 if(errorText){show('Reset link error: '+errorText.replace(/\\+/g,' ')+'. Request a fresh reset email from the app.','error');return}
 let sessionReady=false;
 const access=hash.get('access_token'),refresh=hash.get('refresh_token'),type=hash.get('type');
 if(access && refresh && type==='recovery'){
   const {data,error}=await supabase.auth.setSession({access_token:access,refresh_token:refresh});
   if(error){show('This reset link has expired or was already used. Return to the app and request a new reset email.','error');return}
   sessionReady=!!data.session;
 } else if(query.get('code')){
   const {data,error}=await supabase.auth.exchangeCodeForSession(query.get('code'));
   if(error){show('This reset link has expired or was already used. Request a new reset email.','error');return}
   sessionReady=!!data.session;
 } else {
   const {data}=await supabase.auth.getSession();sessionReady=!!data.session;
 }
 if(!sessionReady){show('Reset link is missing, expired, or already used. Open the newest password-reset email and tap its link once. If it still fails, request a fresh email.','error');return}
 form.hidden=false;show('Verified. Enter your new password below.','ok');
 history.replaceState({},document.title,location.pathname);
}
document.querySelectorAll('.eye').forEach(btn=>btn.addEventListener('click',()=>{
 const input=document.getElementById(btn.dataset.target);input.type=input.type==='password'?'text':'password';btn.textContent=input.type==='password'?'Show':'Hide';
}));
document.getElementById('save').addEventListener('click',async()=>{
 const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(p.length<8){show('Password must contain at least 8 characters.','error');return}
 if(p!==c){show('Passwords do not match.','error');return}
 const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Updating…';
 const {error}=await supabase.auth.updateUser({password:p});
 btn.disabled=false;btn.textContent='Update password';
 if(error){show(error.message,'error');return}
 form.hidden=true;show('Password updated successfully. Return to Your OTT app and sign in with your new password.','ok');
});
init().catch(e=>show(e.message||String(e),'error'));
</script></body></html>
