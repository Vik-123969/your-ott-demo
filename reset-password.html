<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your OTT — Reset password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#241b43,#090b12 55%);color:#f5f3ff;font:16px system-ui,sans-serif;padding:20px}
.card{width:min(100%,520px);background:#151b2a;border:1px solid #30394e;border-radius:24px;padding:32px;box-shadow:0 20px 60px #0006}
h1{margin:0 0 8px;font-size:28px}p{color:#aab4ca;line-height:1.5}
label{display:block;margin:20px 0 8px;font-weight:600}input{width:100%;padding:16px;border-radius:12px;border:1px solid #36415a;background:#0c111d;color:white;font-size:16px}
button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:12px;background:#bba8ff;color:#21183d;font-weight:700;font-size:16px}
#message{margin-top:16px;overflow-wrap:anywhere}.error{color:#ff9aa5}.ok{color:#65e4ba}
</style></head>
<body><main class="card">
<h1>Set a new password</h1><p>Your OTT account password reset</p>
<div id="form" hidden>
<label for="password">New password (at least 8 characters)</label><input id="password" type="password" minlength="8" autocomplete="new-password">
<label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password">
<button id="save">Update password</button>
</div>
<p id="message">Verifying your password reset link…</p>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://sbyzeeipaieyrlicigxo.supabase.co','sb_publishable_NFLGfa4faqKZUhErItWJXw_Vku8Pa0v',{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const form=document.getElementById('form'),message=document.getElementById('message');
function show(text,kind=''){message.textContent=text;message.className=kind}
async function init(){
 const hash=new URLSearchParams(location.hash.slice(1));
 const query=new URLSearchParams(location.search);
 const token=hash.get('access_token')||query.get('token');
 const type=hash.get('type')||query.get('type');
 if(hash.get('error_description')){show(decodeURIComponent(hash.get('error_description').replace(/\+/g,' ')),'error');return}
 if(token && type==='recovery' && !hash.get('access_token')){
  const {error}=await supabase.auth.verifyOtp({token_hash:token,type:'recovery'});
  if(error){show('This reset link is invalid or expired. Request a new password reset email.','error');return}
 }
 const {data,error}=await supabase.auth.getSession();
 if(error||!data.session){show('Reset link is invalid or expired. Return to Your OTT and request a new password reset email.','error');return}
 form.hidden=false;show('Enter and confirm your new password.','ok');
}
document.getElementById('save').addEventListener('click',async()=>{
 const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(p.length<8){show('Password must contain at least 8 characters.','error');return}
 if(p!==c){show('Passwords do not match.','error');return}
 const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Updating…';
 const {error}=await supabase.auth.updateUser({password:p});
 btn.disabled=false;btn.textContent='Update password';
 if(error){show(error.message,'error');return}
 form.hidden=true;show('Password updated successfully. Return to Your OTT app and sign in with your new password.','ok');
});
init().catch(e=>show(e.message||String(e),'error'));
</script></body></html>
